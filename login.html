<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar — Painel Pessoal Norte Rios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<form class="card" id="loginForm" novalidate>
  <p class="brand">Painel Pessoal</p>
  <p class="sub">Norte Rios · Execução Profissional</p>
  <label class="field-label" for="inpEmail">Seu e-mail</label>
  <input type="email" id="inpEmail" placeholder="nome@norterios.com.br" autocomplete="email" required autofocus>
  <button type="submit" class="btn">Entrar</button>
  <div class="error" id="errBox" hidden><b>Acesso negado.</b><span id="errMsg">Este e-mail não está registrado no sistema.</span></div>
</form>

<script src="js/login.js"></script>

</body>
</html>

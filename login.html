<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar — Painel Pessoal Norte Rios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F5F7F1; --surface:#FFFFFF; --border:#DFE4D6;
  --text:#212A1C; --text-soft:#5B6455; --text-faint:#8B9382;
  --verde:#2F4C36; --verde-ink:#1C2E20;
  --vermelho:#B4553E; --vermelho-suave:#F7E3DD;
  --shadow:0 1px 2px rgba(30,38,24,.06), 0 8px 24px rgba(30,38,24,.06);
  --radius:18px; --radius-sm:12px;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171D14; --surface:#20281B; --border:#37432E;
    --text:#EBEEE3; --text-soft:#AEB89F; --text-faint:#7C8570;
    --verde:#8FBC9B; --verde-ink:#DDEAE0;
    --vermelho:#E08268; --vermelho-suave:#3C241D;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#171D14; --surface:#20281B; --border:#37432E;
  --text:#EBEEE3; --text-soft:#AEB89F; --text-faint:#7C8570;
  --verde:#8FBC9B; --verde-ink:#DDEAE0;
  --vermelho:#E08268; --vermelho-suave:#3C241D;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 26px;box-shadow:var(--shadow);}
.brand{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--verde-ink);margin:0 0 2px;}
.sub{margin:0 0 22px;color:var(--text-soft);font-size:13.5px;}
.field-label{font-size:12px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;display:block;}
input[type=email]{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;}
input[type=email]:focus{outline:2px solid var(--verde);outline-offset:1px;}
.btn{margin-top:14px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--verde);background:var(--verde);color:#fff;border-radius:999px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn:hover{opacity:.92;}
.error{margin-top:12px;display:flex;gap:8px;align-items:flex-start;background:var(--vermelho-suave);border:1px solid color-mix(in srgb, var(--vermelho) 40%, transparent);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--text);}
.error b{color:var(--vermelho);}
</style>
</head>
<body>

<form class="card" id="loginForm" novalidate>
  <p class="brand">Painel Pessoal</p>
  <p class="sub">Norte Rios · Execução Profissional</p>
  <label class="field-label" for="inpEmail">Seu e-mail</label>
  <input type="email" id="inpEmail" placeholder="nome@norterios.com.br" autocomplete="email" required autofocus>
  <button type="submit" class="btn">Entrar</button>
  <div class="error" id="errBox" hidden><b>Acesso negado.</b><span id="errMsg">Este e-mail não está registrado no sistema.</span></div>
</form>

<script>
// Lista de e-mails autorizados a acessar o painel. Edite aqui para adicionar/remover pessoas.
const ALLOWED_EMAILS = [
  "tarciunifesspa@gmail.com",
  "diana.amorim.edu@gmail.com",
];
const AUTH_LS_KEY = "nr_painel_auth_v1";

function hasValidLogin(){
  try{
    const a = JSON.parse(localStorage.getItem(AUTH_LS_KEY) || "null");
    return !!(a && a.email);
  }catch(e){ return false; }
}

if(hasValidLogin()){
  location.replace("index.html");
}

const form = document.getElementById("loginForm");
const errBox = document.getElementById("errBox");
const input = document.getElementById("inpEmail");

form.addEventListener("submit", function(e){
  e.preventDefault();
  const email = input.value.trim().toLowerCase();
  const allowed = ALLOWED_EMAILS.map(x=>x.toLowerCase());
  if(email && allowed.includes(email)){
    localStorage.setItem(AUTH_LS_KEY, JSON.stringify({email, ts: Date.now()}));
    location.href = "index.html";
  } else {
    errBox.hidden = false;
    input.focus();
  }
});

input.addEventListener("input", function(){ errBox.hidden = true; });
</script>

</body>
</html>

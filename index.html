<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Norte Rios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<script src="js/auth-guard.js"></script>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img id="logoImg" src="assets/logo.png" alt="Norte Rios" />
      <div class="brand-text"><b>Painel Pessoal</b><span>Norte Rios · Execução Profissional</span></div>
      <div class="brand-meta" id="brandMeta"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="panel-inicio" role="tabpanel"></section>
  <section class="panel" id="panel-semana" role="tabpanel" hidden></section>
  <section class="panel" id="panel-mes" role="tabpanel" hidden></section>
  <section class="panel" id="panel-bimestre" role="tabpanel" hidden></section>
  <section class="panel" id="panel-trimestre" role="tabpanel" hidden></section>
  <section class="panel" id="panel-pdi" role="tabpanel" hidden></section>
  <section class="panel" id="panel-mapa" role="tabpanel" hidden></section>
  <section class="panel" id="panel-indicadores" role="tabpanel" hidden></section>
  <section class="panel" id="panel-ranking" role="tabpanel" hidden></section>
  <footer class="foot">Norte Rios Gestão e Treinamentos · Painel pessoal de execução profissional</footer>
</main>

<div class="save-indicator" id="saveIndicator">Alterações salvas</div>

<script type="module" src="js/app/main.js"></script>
</body>
</html>

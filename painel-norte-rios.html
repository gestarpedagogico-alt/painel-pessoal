<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Painel Norte Rios</title>
<style>
:root{
  --bg:#F5F7F1; --surface:#FFFFFF; --surface-2:#EEF1E8; --border:#DFE4D6;
  --text:#212A1C; --text-soft:#5B6455; --text-faint:#8B9382;
  --verde:#2F4C36; --verde-suave:#E4ECE2; --verde-ink:#1C2E20;
  --laranja:#D9822E; --laranja-suave:#FAEBD9;
  --teal:#3E7C79; --teal-suave:#E2EEEC;
  --amarelo:#D9A22C; --amarelo-suave:#FAF0D9;
  --vermelho:#B4553E; --vermelho-suave:#F7E3DD;
  --shadow:0 1px 2px rgba(30,38,24,.06), 0 8px 24px rgba(30,38,24,.06);
  --radius:18px; --radius-sm:12px;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171D14; --surface:#20281B; --surface-2:#263020; --border:#37432E;
    --text:#EBEEE3; --text-soft:#AEB89F; --text-faint:#7C8570;
    --verde:#8FBC9B; --verde-suave:#26362A; --verde-ink:#DDEAE0;
    --laranja:#F0A85E; --laranja-suave:#3A2C1B;
    --teal:#7FC0BB; --teal-suave:#1E332F;
    --amarelo:#F0C465; --amarelo-suave:#3A3018;
    --vermelho:#E08268; --vermelho-suave:#3C241D;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#171D14; --surface:#20281B; --surface-2:#263020; --border:#37432E;
  --text:#EBEEE3; --text-soft:#AEB89F; --text-faint:#7C8570;
  --verde:#8FBC9B; --verde-suave:#26362A; --verde-ink:#DDEAE0;
  --laranja:#F0A85E; --laranja-suave:#3A2C1B;
  --teal:#7FC0BB; --teal-suave:#1E332F;
  --amarelo:#F0C465; --amarelo-suave:#3A3018;
  --vermelho:#E08268; --vermelho-suave:#3C241D;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
img{max-width:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;}
::selection{background:var(--amarelo-suave);}
button{font-family:inherit;}
a{color:var(--teal);}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 64px;}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

/* header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.topbar::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--verde),var(--teal),var(--amarelo),var(--laranja));}
.topbar-inner{max-width:1180px;margin:0 auto;padding:14px 20px 0;display:flex;flex-direction:column;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{width:34px;height:38px;object-fit:contain;}
.brand-text b{display:block;font-family:var(--font-display);font-size:16px;color:var(--verde);line-height:1.1;}
.brand-text span{display:block;font-size:11.5px;color:var(--text-faint);letter-spacing:.03em;text-transform:uppercase;margin-top:2px;}
.brand-meta{margin-left:auto;text-align:right;font-size:12px;color:var(--text-faint);}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{display:flex;align-items:center;gap:7px;white-space:nowrap;padding:9px 14px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--text-soft);font-size:13.5px;font-weight:600;cursor:pointer;transition:background .15s,color .15s;}
.tab .icon{width:15px;height:15px;}
.tab:hover{background:var(--surface-2);}
.tab[aria-selected="true"]{background:var(--verde);color:#fff;}
.tab:nth-of-type(1) .icon{color:var(--verde);}
.tab:nth-of-type(2) .icon{color:var(--laranja);}
.tab:nth-of-type(3) .icon{color:var(--teal);}
.tab:nth-of-type(4) .icon{color:var(--amarelo);}
.tab:nth-of-type(5) .icon{color:var(--verde);}
.tab:nth-of-type(6) .icon{color:var(--laranja);}
.tab:nth-of-type(7) .icon{color:var(--teal);}
.tab:nth-of-type(8) .icon{color:var(--amarelo);}
.tab:nth-of-type(9) .icon{color:var(--vermelho);}
.tab[aria-selected="true"] .icon{color:#fff;}

.panel{padding-top:22px;}
.panel-head{margin-bottom:18px;}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--laranja);margin:0 0 4px;}
.panel-head h2{font-size:25px;margin:0 0 4px;color:var(--verde-ink);}
.panel-sub{margin:0;color:var(--text-soft);font-size:14px;max-width:60ch;}

/* cards / grid */
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:860px){.grid-2,.grid-3{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
.card h3{font-size:15px;margin:0 0 10px;color:var(--verde-ink);display:flex;align-items:center;gap:8px;}
.card h3 .icon{color:var(--laranja);}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;}
.tag-planejamento{background:var(--teal-suave);color:var(--teal);}
.tag-producao{background:var(--laranja-suave);color:var(--laranja);}
.tag-monitoramento{background:var(--verde-suave);color:var(--verde);}
.tag-projetos{background:var(--amarelo-suave);color:var(--amarelo);}
.tag-formacoes{background:var(--laranja-suave);color:var(--laranja);}
.tag-articulacao{background:var(--teal-suave);color:var(--teal);}
.tag-documentacao{background:var(--verde-suave);color:var(--verde);}
.tag-relatorios{background:var(--laranja-suave);color:var(--laranja);}
.tag-dados{background:var(--verde-suave);color:var(--verde);}
.tag-sistemas{background:var(--amarelo-suave);color:var(--amarelo);}
.tag-pdi{background:var(--verde);color:#fff;}
.tag-rotina{background:var(--surface-2);color:var(--text-soft);}
.tag-janela{background:var(--surface-2);color:var(--text-faint);border:1px dashed var(--border);}

/* inicio */
.hero{background:linear-gradient(135deg,var(--verde) 0%, #24392A 100%);border-radius:var(--radius);padding:26px 26px;color:#fff;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;box-shadow:var(--shadow);}
.hero .date{font-family:var(--font-display);font-size:22px;}
.hero .date small{display:block;font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-bottom:4px;}
.hero-stat{text-align:right;}
.hero-stat .num{font-family:var(--font-display);font-size:30px;line-height:1;}
.hero-stat .lbl{font-size:11.5px;opacity:.8;margin-top:2px;}
.field-label{font-size:12px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;display:flex;align-items:center;gap:6px;}
textarea.free{width:100%;min-height:84px;resize:vertical;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface-2);color:var(--text);font-family:inherit;font-size:13.5px;line-height:1.5;}
textarea.free:focus{outline:2px solid var(--teal);outline-offset:1px;}
.mini-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;}
.mini-list li{display:flex;gap:9px;font-size:13.5px;align-items:flex-start;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--laranja);margin-top:6px;flex-shrink:0;}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--amarelo-suave);border:1px solid color-mix(in srgb, var(--amarelo) 40%, transparent);border-radius:var(--radius-sm);padding:11px 13px;font-size:13px;color:var(--text);}
.alert .icon{color:var(--amarelo);margin-top:1px;}

/* progress */
.progress-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--verde));border-radius:99px;transition:width .3s;}
.pdi-select,.num-input{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;background:var(--surface-2);color:var(--text);font-family:inherit;font-size:13.5px;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}

/* semana */
.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
@media (max-width:980px){.week-grid{grid-template-columns:1fr;}}
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
.day-head{padding:13px 14px 11px;color:#fff;}
.day-head .d{font-family:var(--font-display);font-size:16px;}
.day-head .f{font-size:11.5px;opacity:.85;margin-top:2px;}
.day-body{padding:10px;display:flex;flex-direction:column;gap:8px;}
.block{border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 10px;display:flex;gap:9px;align-items:flex-start;background:var(--surface);transition:opacity .15s;}
.block.pdi-block{background:var(--verde-suave);border-color:color-mix(in srgb, var(--verde) 35%, transparent);}
.block.done{opacity:.5;}
.block.done .btxt{text-decoration:line-through;}
.block input[type=checkbox]{margin-top:2px;width:16px;height:16px;accent-color:var(--verde);flex-shrink:0;cursor:pointer;}
.block .lock{margin-top:2px;color:var(--verde);flex-shrink:0;}
.btime{font-size:11px;font-weight:700;color:var(--text-faint);letter-spacing:.02em;}
.btxt{font-size:12.8px;line-height:1.45;margin:2px 0 6px;}
.lunch{text-align:center;font-size:11.5px;color:var(--text-faint);padding:4px 0;font-style:italic;}
.week-toolbar{display:flex;justify-content:flex-end;margin-bottom:12px;}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
.btn:hover{background:var(--surface-2);}
.btn .icon{width:14px;height:14px;}

/* month */
.month-tabs{display:flex;gap:8px;margin-bottom:16px;}
.mtab{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-soft);}
.mtab[aria-selected="true"]{background:var(--laranja);border-color:var(--laranja);color:#fff;}
.phase{border-left:3px solid var(--teal);padding:4px 0 4px 14px;margin-bottom:14px;}
.phase.p2{border-color:var(--laranja);}
.phase.p3{border-color:var(--verde);}
.phase h4{margin:0 0 6px;font-size:13.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--verde-ink);}
.phase p{margin:0;font-size:13.8px;color:var(--text-soft);line-height:1.6;}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;background:var(--surface);font-size:13.2px;}
thead th{background:var(--verde);color:#fff;text-align:left;padding:10px 13px;font-weight:700;font-size:12px;letter-spacing:.02em;white-space:nowrap;}
tbody td{padding:11px 13px;border-top:1px solid var(--border);vertical-align:top;line-height:1.5;}
tbody tr:nth-child(even){background:var(--surface-2);}
.wpeso{color:var(--laranja);font-weight:700;font-size:11.5px;}

/* status select */
.status-select{border:1px solid var(--border);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--text);}
.st-afazer{background:var(--surface-2);color:var(--text-soft);}
.st-andamento{background:var(--teal-suave);color:var(--teal);}
.st-concluido{background:var(--verde-suave);color:var(--verde);}
.st-aguardando{background:var(--amarelo-suave);color:var(--amarelo);}
.st-bloqueado{background:var(--vermelho-suave);color:var(--vermelho);}

/* eixo card */
.eixo-card{border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);background:var(--surface);}
.eixo-top{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.eixo-top h3{margin:0;font-size:16px;}
.eixo-body{padding:6px 18px 16px;}
.curso-row{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:13px;align-items:baseline;}
.curso-row:first-child{border-top:none;}
.curso-mes{font-weight:700;color:var(--text-faint);font-size:11.5px;min-width:96px;flex-shrink:0;}
.curso-ch{color:var(--text-faint);font-size:12px;font-style:italic;margin-left:6px;}
.aplicacao{margin-top:12px;background:var(--surface-2);border-radius:var(--radius-sm);padding:11px 13px;font-size:12.8px;color:var(--text-soft);line-height:1.55;}
.aplicacao b{color:var(--text);}

/* encontros escola de gestores */
.chip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.chip-obrigatorio{background:var(--vermelho);color:#fff;}
.chip-hoje{background:var(--vermelho);color:#fff;}
.chip-semana{background:var(--laranja);color:#fff;}
.chip-passado{background:var(--surface-2);color:var(--text-faint);}
.chip-mini{background:var(--teal);color:#fff;font-size:10px;padding:4px 8px;border-radius:8px;min-width:34px;text-align:center;}
.card-alerta{border:1px solid color-mix(in srgb, var(--vermelho) 35%, var(--border));background:linear-gradient(135deg, var(--vermelho-suave) 0%, var(--surface) 65%);}
.encontro-destaque{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border);}
.ed-data{font-family:var(--font-display);font-size:19px;color:var(--verde-ink);min-width:150px;}
.ed-data span{display:block;font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--text-faint);text-transform:capitalize;}
.ed-info{flex:1;min-width:160px;}
.ed-h{font-size:13px;font-weight:700;color:var(--text);}
.ed-p{font-size:12.5px;color:var(--text-soft);margin-top:2px;}
.confirm-check{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--text-soft);cursor:pointer;user-select:none;}
.confirm-check input{width:17px;height:17px;accent-color:var(--verde);cursor:pointer;}
.encontro-list{display:flex;flex-direction:column;gap:8px;}
.encontro-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);transition:opacity .15s;}
.encontro-row.is-today{border-color:var(--vermelho);background:var(--vermelho-suave);}
.encontro-row.done{opacity:.55;}
.encontro-row.done .er-h{text-decoration:line-through;}
.er-data{font-weight:800;font-size:13px;color:var(--verde-ink);min-width:112px;}
.er-data span{display:block;font-size:10.5px;font-weight:600;color:var(--text-faint);text-transform:capitalize;}
.er-info{flex:1;min-width:180px;}
.er-h{font-size:12.8px;font-weight:700;color:var(--text);}
.er-p{font-size:12px;color:var(--text-soft);margin-top:1px;}
.encontro-row.compact{padding:8px 10px;gap:10px;}
.encontro-row.compact .er-h{font-size:12px;}

/* indicadores */
.stat-grid{grid-template-columns:repeat(5,1fr);}
@media (max-width:760px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 10px;text-align:center;box-shadow:var(--shadow);border-top:4px solid var(--text-faint);}
.stat-num{font-family:var(--font-display);font-size:27px;line-height:1;color:var(--text);}
.stat-lbl{font-size:10.5px;color:var(--text-soft);margin-top:6px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
.st-card-afazer{border-top-color:var(--text-faint);}
.st-card-andamento{border-top-color:var(--teal);}
.st-card-concluido{border-top-color:var(--verde);}
.st-card-aguardando{border-top-color:var(--amarelo);}
.st-card-bloqueado{border-top-color:var(--vermelho);}
.seg-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-2);}
.seg{height:100%;}
.seg-afazer{background:var(--text-faint);}
.seg-andamento{background:var(--teal);}
.seg-concluido{background:var(--verde);}
.seg-aguardando{background:var(--amarelo);}
.seg-bloqueado{background:var(--vermelho);}
.seg-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--text-soft);}
.leg-item{display:inline-flex;align-items:center;}
.leg-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}
.leg-dot.dot-afazer{background:var(--text-faint);}
.leg-dot.dot-andamento{background:var(--teal);}
.leg-dot.dot-concluido{background:var(--verde);}
.leg-dot.dot-aguardando{background:var(--amarelo);}
.leg-dot.dot-bloqueado{background:var(--vermelho);}

/* ranking */
.rank-list{display:flex;flex-direction:column;gap:7px;}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--surface-2);}
.rank-pos{width:22px;height:22px;border-radius:50%;background:var(--verde);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rank-info{flex:1;min-width:0;}
.rank-nome{font-size:12.8px;font-weight:700;color:var(--text);}
.rank-peso{font-size:11px;color:var(--text-faint);margin-top:1px;}
.badge-status{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
.badge-status.st-afazer{background:var(--surface);color:var(--text-soft);border:1px solid var(--border);}
.badge-status.st-andamento{background:var(--teal-suave);color:var(--teal);}
.badge-status.st-concluido{background:var(--verde-suave);color:var(--verde);}
.badge-status.st-aguardando{background:var(--amarelo-suave);color:var(--amarelo);}
.badge-status.st-bloqueado{background:var(--vermelho-suave);color:var(--vermelho);}

/* editable content */
.editable{outline:none;border-radius:5px;padding:1px 3px;margin:-1px -3px;cursor:text;transition:background .15s, box-shadow .15s;}
.editable:hover{background:color-mix(in srgb, var(--amarelo) 14%, transparent);}
.editable:focus{background:var(--amarelo-suave);box-shadow:0 0 0 2px color-mix(in srgb, var(--amarelo) 55%, transparent);}

footer.foot{text-align:center;padding:30px 0 6px;color:var(--text-faint);font-size:12px;}
.small-note{font-size:12px;color:var(--text-faint);margin-top:6px;}
.save-indicator{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--verde);color:#fff;font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity .25s, transform .25s;pointer-events:none;z-index:60;}
.save-indicator.show{opacity:1;transform:translateY(0);}

  }catch(e){ /* conflito ou indisponivel, sem retry */ }\n  }, 700);\n}\nfunction showSaveIndicator(){\n  const el = document.getElementById('saveIndicator');\n  if(!el) return;\n  el.classList.add('show');\n  clearTimeout(el._t);\n  el._t = setTimeout(()=>el.classList.remove('show'), 1600);\n}\nfunction replaceFirst(str, token, val){\n  const i = str.indexOf(token);\n  if(i<0) return str;\n  return str.slice(0,i) + val + str.slice(i+token.length);\n}\nfunction sealScriptClose(jsonStr){ return jsonStr.replace(/<\\/script/gi, \"<\\\\/script\"); }\nfunction buildFullDocument(st){\n  const shell = window.__NR_SHELL_TEMPLATE__;\n  const escapedShell = sealScriptClose(JSON.stringify(shell));\n  let doc = shell.replace('SHELL_TEMPLATE_TOKEN_9c1b', escapedShell);\n  doc = replaceFirst(doc, 'STATE_JSON_TOKEN_7f3a', sealScriptClose(JSON.stringify(st)));\n  return '<!doctype html>\\n<html lang=\"pt-BR\">\\n<head>\\n<meta charset=\"utf-8\">\\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\\n</head>\\n<body>\\n' + doc + '\\n</body>\\n</html>';\n}\nasync function loadInitialState(){\n  let embedded = defaultState();\n  try{ embedded = JSON.parse(document.getElementById('state-data').textContent); }catch(e){}\n  try{\n    const artifact = await window.claude?.use?.('artifact');\n    if(!artifact){\n      const ls = localStorage.getItem(LS_KEY);\n      if(ls){ try{ return Object.assign(defaultState(), JSON.parse(ls)); }catch(e){} }\n    }\n  }catch(e){\n    const ls = localStorage.getItem(LS_KEY);\n    if(ls){ try{ return Object.assign(defaultState(), JSON.parse(ls)); }catch(e2){} }\n  }\n  return Object.assign(defaultState(), embedded);\n}\n\n/* ============ HELPERS ============ */\nfunction esc(s){ return String(s==null?'':s).replace(/[&<>\"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\nfunction natClass(n){ return NATURE_CLASS[n] || 'rotina'; }\nfunction pct(n,d){ return Math.round((n/d)*100); }\n/* ============ EDITABLE TEXT ============ */\nfunction ed(key, fallback){\n  const v = state.edits && state.edits[key];\n  return (v!==undefined && v!==null && v!==\"\") ? v : fallback;\n}\nfunction edHtml(key, fallback, tag, extra){\n  tag = tag || \"span\";\n  return '<'+tag+' class=\"editable '+(extra||'')+'\" contenteditable=\"true\" spellcheck=\"false\" data-edit-key=\"'+key+'\">'+esc(ed(key,fallback)).replace(/\\n/g,\"<br>\")+'</'+tag+'>';\n}\nfunction setupEditableDelegation(){\n  const root = document.querySelector(\"main.wrap\");\n  if(!root || root._editWired) return;\n  root._editWired = true;\n  root.addEventListener(\"input\", e=>{\n    const t = e.target;\n    if(!(t instanceof HTMLElement) || !t.hasAttribute(\"data-edit-key\")) return;\n    const key = t.getAttribute(\"data-edit-key\");\n    state.edits[key] = (t.innerText || \"\").replace(/\\n+$/,\"\");\n    if(key.startsWith(\"tri_\") && (key.endsWith(\"_peso\") || key.endsWith(\"_nome\"))){\n      renderRanking();\n    }\n    scheduleSave();\n  });\n}\nfunction todayStr(){\n  const d = new Date();\n  const dias=[\"domingo\",\"segunda-feira\",\"terça-feira\",\"quarta-feira\",\"quinta-feira\",\"sexta-feira\",\"sábado\"];\n  const meses=[\"janeiro\",\"fevereiro\",\"março\",\"abril\",\"maio\",\"junho\",\"julho\",\"agosto\",\"setembro\",\"outubro\",\"novembro\",\"dezembro\"];\n  return {dow:dias[d.getDay()], full:d.getDate()+\" de \"+meses[d.getMonth()]+\" de \"+d.getFullYear(), d};\n}\nfunction mesAtualKey(){\n  const m = new Date().getMonth(); // 8=set,9=out,10=nov\n  if(m<=8) return \"set\"; if(m===9) return \"out\"; return \"nov\";\n}\n\n/* ============ TABS ============ */\nconst TABS = [\n  {key:\"inicio\", label:\"Início\", icon:\"home\"},\n  {key:\"semana\", label:\"Semana\", icon:\"week\"},\n  {key:\"mes\", label:\"Mês\", icon:\"month\"},\n  {key:\"bimestre\", label:\"Bimestre\", icon:\"bim\"},\n  {key:\"trimestre\", label:\"Trimestre\", icon:\"tri\"},\n  {key:\"pdi\", label:\"PDI\", icon:\"pdi\"},\n  {key:\"mapa\", label:\"Mapa de entregas\", icon:\"map\"},\n  {key:\"indicadores\", label:\"Indicadores\", icon:\"chart\"},\n  {key:\"ranking\", label:\"Ranking\", icon:\"ranking\"},\n];\nlet activeTab = \"inicio\";\n\nfunction renderTabs(){\n  const nav = document.getElementById(\"tabs\");\n  nav.innerHTML = TABS.map(t=>`<button class=\"tab\" role=\"tab\" data-tab=\"${t.key}\" aria-selected=\"${t.key===activeTab}\">${icon(t.icon)}${t.label}</button>`).join(\"\");\n  nav.querySelectorAll(\".tab\").forEach(btn=>{\n    btn.addEventListener(\"click\", ()=>{ switchTab(btn.dataset.tab); });\n  });\n}\nfunction switchTab(key){\n  activeTab = key;\n  TABS.forEach(t=>{\n    document.getElementById(\"panel-\"+t.key).hidden = t.key!==key;\n  });\n  document.querySelectorAll(\".tab\").forEach(b=>b.setAttribute(\"aria-selected\", String(b.dataset.tab===key)));\n  window.scrollTo({top:0, behavior:\"instant\"});\n}\n\n/* ============ INICIO ============ */\nfunction proximasEntregas(){\n  const mk = mesAtualKey();\n  const map = {set:\"Fechamento do relatório de setembro e consolidação da frequência da ImersA\",\n    out:\"Fechamento do relatório de outubro e acompanhamento das Atas de Formação\",\n    nov:\"Relatório executivo do Ciclo Formativo, até 11 de dezembro, e síntese trimestral da IMERSA\"};\n  return [\n    map[mk],\n    \"Consolidação semanal de devolutivas e pendências do setor\",\n    \"Registro mensal de estudos do PDI, Item 10 do Plano de Trabalho\",\n  ];\n}\nfunction proximoEncontroCardHtml(){\n  const prox = proximoEncontroGestores();\n  if(!prox) return \"\";\n  const hoje = isTodayEncontro(prox);\n  const semana = isThisWeekEncontro(prox);\n  const confirmado = !!state.checks[prox.id];\n  const rotulo = hoje ? \"É hoje\" : (semana ? \"Esta semana\" : \"Próximo compromisso\");\n  return `<div class=\"card card-alerta\" style=\"margin-top:16px;\">\n    <div class=\"row-between\" style=\"flex-wrap:wrap;gap:10px;\">\n      <h3 style=\"margin:0;\">${icon(\"bell\")}Encontro obrigatório, Escola de Gestores, Pacajá</h3>\n      <span class=\"chip chip-obrigatorio\">${rotulo}</span>\n    </div>\n    <div class=\"encontro-destaque\">\n      <div class=\"ed-data\">${esc(prox.dataLabel)}<span>${esc(prox.dow)}</span></div>\n      <div class=\"ed-info\">\n        <div class=\"ed-h\">${esc(prox.h)}${prox.mes===\"dez\"?\" · presencial em Pacajá\":\" · online\"}</div>\n        <div class=\"ed-p\">${esc(prox.publico)} · ${esc(prox.enc)}</div>\n      </div>\n      <label class=\"confirm-check\"><input type=\"checkbox\" data-id=\"${prox.id}\" ${confirmado?\"checked\":\"\"}><span>Presença confirmada</span></label>\n    </div>\n    <p class=\"small-note\" style=\"margin-top:10px;\">Presença obrigatória em todos os dez encontros online, de setembro a novembro, mais o Seminário de Integração presencial em 4 de dezembro. Lista completa na aba Semana.</p>\n  </div>`;\n}\nfunction renderInicio(){\n  const t = todayStr();\n  const cursoAtual = PDI_CURSO_OPTS.find(o=>o.v===state.pdiCursoAtual) || PDI_CURSO_OPTS[0];\n  const el = document.getElementById(\"panel-inicio\");\n  el.innerHTML = `\n    <div class=\"hero\">\n      <div class=\"date\"><small>${t.dow}</small>${t.full}</div>\n      <div class=\"hero-stat\"><div class=\"num\">${state.pdiPercent}%</div><div class=\"lbl\">avanço do PDI</div></div>\n    </div>\n    ${proximoEncontroCardHtml()}\n    <div class=\"grid grid-3\" style=\"margin-top:16px;\">\n      <div class=\"card\">\n        <h3>${icon(\"flag\")}Prioridades da semana</h3>\n        <textarea class=\"free\" id=\"inpPrioridades\" placeholder=\"O que precisa sair até sexta\">${esc(state.prioridades)}</textarea>\n      </div>\n      <div class=\"card\">\n        <h3>${icon(\"bell\")}Pendências</h3>\n        <textarea class=\"free\" id=\"inpPendencias\" placeholder=\"O que ficou em aberto\">${esc(state.pendencias)}</textarea>\n      </div>\n      <div class=\"card\">\n        <h3>${icon(\"check\")}Observações</h3>\n        <textarea class=\"free\" id=\"inpObservacoes\" placeholder=\"Anotações livres\">${esc(state.observacoes)}</textarea>\n      </div>\n    </div>\n    <div class=\"grid grid-2\" style=\"margin-top:14px;\">\n      <div class=\"card\">\n        <h3>${icon(\"target\")}Próximas entregas</h3>\n        <ul class=\"mini-list\">${proximasEntregas().map(x=>`<li><span class=\"dot\"></span>${esc(x)}</li>`).join(\"\")}</ul>\n      </div>\n      <div class=\"card\">\n        <h3>${icon(\"pdi\")}Curso atual do PDI</h3>\n        <div class=\"field-label\">Curso em andamento</div>\n        <select class=\"pdi-select\" id=\"selCursoAtual\">${PDI_CURSO_OPTS.map(o=>`<option value=\"${o.v}\" ${o.v===state.pdiCursoAtual?\"selected\":\"\"}>${esc(o.l)}</option>`).join(\"\")}</select>\n        <div class=\"field-label\" style=\"margin-top:12px;\">Percentual concluído</div>\n        <div class=\"row-between\"><input type=\"range\" min=\"0\" max=\"100\" step=\"5\" id=\"rngPercent\" value=\"${state.pdiPercent}\" style=\"flex:1;accent-color:var(--verde);\"><b style=\"width:42px;text-align:right;\">${state.pdiPercent}%</b></div>\n        <div class=\"progress-track\" style=\"margin-top:8px;\"><div class=\"progress-fill\" style=\"width:${state.pdiPercent}%;\"></div></div>\n        <div class=\"alert\" style=\"margin-top:14px;\">${icon(\"bell\")}<span>As Jornadas Pedagógicas entram no planejamento somente a partir de novembro de 2026. Setembro e outubro seguem sem essa frente.</span></div>\n      </div>\n    </div>`;\n  document.getElementById(\"inpPrioridades\").addEventListener(\"input\", e=>{ state.prioridades=e.target.value; scheduleSave(); });\n  document.getElementById(\"inpPendencias\").addEventListener(\"input\", e=>{ state.pendencias=e.target.value; scheduleSave(); });\n  document.getElementById(\"inpObservacoes\").addEventListener(\"input\", e=>{ state.observacoes=e.target.value; scheduleSave(); });\n  const ccCard = el.querySelector(\".confirm-check input\");\n  if(ccCard){ ccCard.addEventListener(\"change\", e=>{ state.checks[e.target.dataset.id]=e.target.checked; renderIndicadores(); scheduleSave(); }); }\n  document.getElementById(\"selCursoAtual\").addEventListener(\"change\", e=>{ state.pdiCursoAtual=e.target.value; scheduleSave(); });\n  const rng = document.getElementById(\"rngPercent\");\n  rng.addEventListener(\"input\", e=>{\n    state.pdiPercent = Number(e.target.value);\n    rng.parentElement.querySelector(\"b\").textContent = state.pdiPercent+\"%\";\n    rng.closest(\".card\").querySelector(\".progress-fill\").style.width = state.pdiPercent+\"%\";\n    document.querySelector(\".hero-stat .num\").textContent = state.pdiPercent+\"%\";\n  });\n  rng.addEventListener(\"change\", ()=>scheduleSave());\n}\n\n/* ============ SEMANA ============ */\nfunction encontrosGestoresListHtml(){\n  const rows = TODOS_ENCONTROS_GESTORES.map(it=>{\n    const done = !!state.checks[it.id];\n    const past = isPastEncontro(it);\n    const hoje = isTodayEncontro(it);\n    const semana = isThisWeekEncontro(it);\n    let badge = \"\";\n    if(hoje) badge = `<span class=\"chip chip-hoje\">Hoje</span>`;\n    else if(past) badge = `<span class=\"chip chip-passado\">Realizado</span>`;\n    else if(semana) badge = `<span class=\"chip chip-semana\">Esta semana</span>`;\n    return `<div class=\"encontro-row ${done?'done':''} ${hoje?'is-today':''}\">\n      <label class=\"confirm-check\"><input type=\"checkbox\" data-id=\"${it.id}\" ${done?\"checked\":\"\"}><span></span></label>\n      <div class=\"er-data\">${esc(it.dataLabel)}<span>${esc(it.dow)}</span></div>\n      <div class=\"er-info\">\n        <div class=\"er-h\">${esc(it.h)}${it.mes===\"dez\"?\" · presencial em Pacajá\":\" · online, presença obrigatória\"}</div>\n        <div class=\"er-p\">${esc(it.publico)} · ${esc(it.enc)}</div>\n      </div>\n      ${badge}\n    </div>`;\n  }).join(\"\");\n  return `<div class=\"card\" style=\"margin-bottom:16px;\">\n    <h3>${icon(\"bell\")}Escola de Gestores e Lideranças Educacionais, Pacajá</h3>\n    <p class=\"panel-sub\" style=\"margin-bottom:12px;\">Dez encontros online, de setembro a novembro, mais o Seminário de Integração presencial em 4 de dezembro. Presença obrigatória em todos. Estes compromissos têm data marcada e não se repetem toda semana, por isso ficam à parte da grade abaixo.</p>\n    <div class=\"encontro-list\">${rows}</div>\n  </div>`;\n}\nfunction renderSemana(){\n  const el = document.getElementById(\"panel-semana\");\n  el.innerHTML = `\n    <div class=\"panel-head\"><p class=\"eyebrow\">Segunda a sexta</p><h2>Cronograma semanal</h2>\n      <p class=\"panel-sub\">Jornada das 9h às 18h, almoço das 13h às 14h. Quarta e sexta, das 16h às 18h, ficam protegidas para o PDI.</p></div>\n    ${encontrosGestoresListHtml()}\n    <div class=\"week-toolbar\"><button class=\"btn\" id=\"btnResetWeek\">${icon(\"reset\")}Reiniciar marcações da semana</button></div>\n    <div class=\"week-grid\">${WEEK.map(renderDay).join(\"\")}</div>`;\n  el.querySelectorAll(\".block input[type=checkbox]\").forEach(cb=>{\n    cb.addEventListener(\"change\", e=>{\n      const id = e.target.dataset.id;\n      state.checks[id] = e.target.checked;\n      e.target.closest(\".block\").classList.toggle(\"done\", e.target.checked);\n      scheduleSave();\n    });\n  });\n  el.querySelectorAll(\".encontro-row input[type=checkbox]\").forEach(cb=>{\n    cb.addEventListener(\"change\", e=>{\n      const id = e.target.dataset.id;\n      state.checks[id] = e.target.checked;\n      e.target.closest(\".encontro-row\").classList.toggle(\"done\", e.target.checked);\n      renderIndicadores();\n      scheduleSave();\n    });\n  });\n  document.getElementById(\"btnResetWeek\").addEventListener(\"click\", ()=>{\n    WEEK.forEach(d=>d.blocos.forEach(b=>{ if(!b.lunch) delete state.checks[b.id]; }));\n    renderSemana();\n    scheduleSave();\n  });\n}\nfunction renderDay(day){\n  return `<div class=\"day-card\">\n    <div class=\"day-head\" style=\"background:${day.cor};\"><div class=\"d\">${day.nome}-feira</div><div class=\"f\">${edHtml('foco_'+day.key, day.foco)}</div></div>\n    <div class=\"day-body\">${day.blocos.map(b=>{\n      if(b.lunch) return `<div class=\"lunch\">Almoço, 13h às 14h</div>`;\n      const done = !!state.checks[b.id];\n      return `<div class=\"block ${b.n==='PDI'?'pdi-block':''} ${done?'done':''}\">\n        ${b.lock ? `<span class=\"lock\">${icon(\"lock\")}</span>` : `<input type=\"checkbox\" data-id=\"${b.id}\" ${done?\"checked\":\"\"}>`}\n        <div style=\"flex:1;min-width:0;\">\n          <div class=\"btime\">${edHtml('h_'+b.id, b.h)}</div>\n          ${edHtml('t_'+b.id, b.t, \"div\", \"btxt\")}\n          <span class=\"tag tag-${natClass(b.n)}\">${b.n}</span>\n        </div>\n      </div>`;\n    }).join(\"\")}</div>\n  </div>`;\n}\n\n/* ============ MES ============ */\nfunction encontrosDoMesHtml(mk){\n  const doMes = TODOS_ENCONTROS_GESTORES.filter(it=>it.mes===mk);\n  if(!doMes.length) return \"\";\n  const rows = doMes.map(it=>{\n    const done = !!state.checks[it.id];\n    return `<div class=\"encontro-row compact ${done?'done':''}\">\n      <span class=\"chip chip-mini\">${esc(it.dataLabel.split(\" de \")[0])}</span>\n      <div class=\"er-info\">\n        <div class=\"er-h\">${esc(it.dow)}, ${esc(it.h)}</div>\n        <div class=\"er-p\">${esc(it.publico)} · ${esc(it.enc)}</div>\n      </div>\n    </div>`;\n  }).join(\"\");\n  return `<div class=\"card\" style=\"margin-top:14px;\">\n    <h3>${icon(\"bell\")}Encontros da Escola de Gestores neste mês</h3>\n    <div class=\"encontro-list\">${rows}</div>\n  </div>`;\n}\nfunction renderMes(){\n  const el = document.getElementById(\"panel-mes\");\n  const mk = state.mesAtivo || mesAtualKey();\n  const m = MESES[mk];\n  el.innerHTML = `\n    <div class=\"panel-head\"><p class=\"eyebrow\">Visão mensal</p><h2>${m.label} de 2026</h2>\n      <p class=\"panel-sub\">O que precisa acontecer no começo, durante e no fim do mês.</p></div>\n    <div class=\"month-tabs\">${Object.keys(MESES).map(k=>`<button class=\"mtab\" data-m=\"${k}\" aria-selected=\"${k===mk}\">${MESES[k].label}</button>`).join(\"\")}</div>\n    <div class=\"alert\" style=\"margin-bottom:16px;\">${icon(\"bell\")}${edHtml('mes_'+mk+'_nota', m.nota)}</div>\n    <div class=\"grid\" style=\"grid-template-columns:1fr;gap:0;\">\n      <div class=\"card\">\n        <div class=\"phase p1\"><h4>Início do mês</h4>${edHtml('mes_'+mk+'_inicio', m.inicio, \"p\")}</div>\n        <div class=\"phase p2\"><h4>Durante o mês</h4>${edHtml('mes_'+mk+'_durante', m.durante, \"p\")}</div>\n        <div class=\"phase p3\"><h4>Final do mês</h4>${edHtml('mes_'+mk+'_fim', m.fim, \"p\")}</div>\n      </div>\n    </div>\n    ${encontrosDoMesHtml(mk)}`;\n  el.querySelectorAll(\".mtab\").forEach(btn=>{\n    btn.addEventListener(\"click\", ()=>{ state.mesAtivo = btn.dataset.m; renderMes(); scheduleSave(); });\n  });\n}\n\n/* ============ BIMESTRE ============ */\nfunction renderBimestre(){\n  const el = document.getElementById(\"panel-bimestre\");\n  el.innerHTML = `\n    <div class=\"panel-head\"><p class=\"eyebrow\">Setembro a dezembro</p><h2>Acompanhamento bimestral</h2>\n      <p class=\"panel-sub\">Pontos de revisão mais estratégicos, a cada dois meses.</p></div>\n    <div class=\"table-wrap\"><table><thead><tr><th>O que acompanhar</th><th>Evidência</th><th>Situação esperada</th><th>Próximo encaminhamento</th></tr></thead>\n    <tbody>${BIMESTRE.map((r,i)=>`<tr><td><b>${edHtml('bim_'+i+'_o', r.o)}</b></td><td>${edHtml('bim_'+i+'_e', r.e)}</td><td>${edHtml('bim_'+i+'_s', r.s)}</td><td>${edHtml('bim_'+i+'_p', r.p)}</td></tr>`).join(\"\")}</tbody></table></div>`;\n}\n\n/* ============ TRIMESTRE ============ */\nfunction triText(n, field, fallback){ return ed('tri_'+n+'_'+field, fallback); }\nfunction triPeso(fr){\n  const raw = state.edits['tri_'+fr.n+'_peso'];\n  if(raw===undefined || raw===null || raw===\"\") return fr.peso;\n  const num = parseFloat(String(raw).replace(\",\", \".\").replace(\"%\",\"\"));\n  return isNaN(num) ? fr.peso : num;\n}\nfunction renderTrimestre(){\n  const el = document.getElementById(\"panel-trimestre\");\n  el.innerHTML = `\n    <div class=\"panel-head\"><p class=\"eyebrow\">1 de setembro a 1 de dezembro de 2026</p><h2>Visão trimestral</h2>\n      <p class=\"panel-sub\">Metas, ações, produtos, prazos, evidências e resultado esperado para as 11 frentes do Plano de Trabalho.</p></div>\n    <div class=\"table-wrap\"><table><thead><tr><th>Frente</th><th>Meta</th><th>Ações</th><th>Produto</th><th>Prazo</th><th>Evidência</th><th>Resultado esperado</th></tr></thead>\n    <tbody>${TRIMESTRE.map(r=>`<tr><td><b>${r.n}. ${edHtml('tri_'+r.n+'_nome', r.nome)}</b><br><span class=\"wpeso\">${edHtml('tri_'+r.n+'_peso', String(r.peso), \"span\")}%</span></td><td>${edHtml('tri_'+r.n+'_meta', r.meta)}</td><td>${edHtml('tri_'+r.n+'_acoes', r.acoes)}</td><td>${edHtml('tri_'+r.n+'_prod', r.prod)}</td><td>${edHtml('tri_'+r.n+'_prazo', r.prazo)}</td><td>${edHtml('tri_'+r.n+'_ev', r.ev)}</td><td>${edHtml('tri_'+r.n+'_res', r.res)}</td></tr>`).join(\"\")}</tbody></table></div>`;\n}\n\n/* ============ PDI ============ */\nfunction eixoCardHtml(key){\n  const e = EIXOS[key];\n  return `<div class=\"eixo-card\">\n    <div class=\"eixo-top\" style=\"background:color-mix(in srgb, ${e.cor} 12%, transparent);\">\n      <h3 style=\"color:${e.cor};\">${esc(e.nome)}</h3>\n      <span class=\"tag\" style=\"background:${e.cor};color:#fff;\">${edHtml('eixo_'+key+'_prioridade', e.prioridade, \"span\")}</span>\n    </div>\n    <div class=\"eixo-body\">\n      ${e.cursos.map(c=>`<div class=\"curso-row\"><span class=\"curso-mes\">${c.m}</span><span>${esc(c.c)}</span></div>`).join(\"\")}\n      <div class=\"aplicacao\"><b>Aplicação prática.</b> ${edHtml('eixo_'+key+'_aplicacao', e.aplicacao, \"span\")}</div>\n    </div>\n  </div>`;\n}\nfunction renderPDI(){\n  const el = document.getElementById(\"panel-pdi\");\n  el.innerHTML = `\n    <div class=\"panel-head\"><p class=\"eyebrow\">Plano de Desenvolvimento Individual</p><h2>Trilha de estudos</h2>\n      <p class=\"panel-sub\">Blocos protegidos de quarta e sexta, das 16h às 18h. Estratégia híbrida: o Eixo A segue de forma sequencial nas quartas, e os Eixos C, G e B se alternam nas sextas conforme a janela de meses de cada um.</p></div>\n    <div class=\"card\" style=\"margin-bottom:16px;\">\n      <h3>${icon(\"pdi\")}Avanço geral</h3>\n      <div class=\"row-between\"><span style=\"font-size:13px;color:var(--text-soft);\">Curso atual: <b>${esc((PDI_CURSO_OPTS.find(o=>o.v===state.pdiCursoAtual)||{}).l||\"\")}</b></span><b>${state.pdiPercent}%</b></div>\n      <div class=\"progress-track\" style=\"margin-top:8px;\"><div class=\"progress-fill\" style=\"width:${state.pdiPercent}%;\"></div></div>\n    </div>\n    <div class=\"grid\" style=\"grid-template-columns:1fr;gap:16px;\">\n      ${eixoCardHtml(\"A\")}${eixoCardHtml(\"C\")}${eixoCardHtml(\"G\")}${eixoCardHtml(\"B\")}\n    </div>\n    <div class=\"card\" style=\"margin-top:16px;\">\n      <h3>Demais eixos, prioridade média e média baixa</h3>\n      <p class=\"panel-sub\" style=\"margin-bottom:10px;\">Cursos previstos a partir do mês 5, já no próximo trimestre. Ficam fora dos blocos de quarta e sexta por enquanto.</p>\n      <div class=\"grid grid-3\">${EIXOS_MEDIA.map(x=>`<div class=\"row-between\" style=\"background:var(--surface-2);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;\"><span>${esc(x.n)}</span><span class=\"tag tag-rotina\">${x.p}</span></div>`).join(\"\")}</div>\n    </div>`;\n}\n\n/* ============ MAPA DE ENTREGAS ============ */\nfunction statusOptionsHtml(current){\n  return STATUS_OPTS.map(o=>`<option value=\"${o.v}\" ${o.v===current?\"selected\":\"\"}>${o.l}</option>`).join(\"\");\n}\nfunction renderMapa(){\n  const el = document.getElementById(\"panel-mapa\");\n  el.innerHTML = `\n    <div class=\"panel-head\"><p class=\"eyebrow\">Rotina, mês e trimestre, na mesma tabela</p><h2>Mapa de entregas</h2>\n      <p class=\"panel-sub\">Cada atividade recorrente da rotina alimenta uma entrega, com sua periodicidade, evidência e a meta do Plano de Trabalho a que se conecta. Marque o status conforme o andamento.</p></div>\n    <div class=\"table-wrap\"><table><thead><tr><th>Atividade recorrente</th><th>Entrega relacionada</th><th>Periodicidade</th><th>Evidência</th><th>Meta do Plano</th><th>Status</th></tr></thead>\n    <tbody>${MAPA.map(r=>{\n      const st = state.entregaStatus[r.id] || \"afazer\";\n      return `<tr><td><b>${edHtml('mapa_'+r.id+'_a', r.a)}</b></td><td>${edHtml('mapa_'+r.id+'_e', r.e)}</td><td>${edHtml('mapa_'+r.id+'_per', r.per)}</td><td>${edHtml('mapa_'+r.id+'_ev', r.ev)}</td><td>${edHtml('mapa_'+r.id+'_meta', r.meta)}</td>\n      <td><select class=\"status-select st-${st}\" data-id=\"${r.id}\">${statusOptionsHtml(st)}</select></td></tr>`;\n    }).join(\"\")}</tbody></table></div>`;\n  el.querySelectorAll(\".status-select\").forEach(sel=>{\n    sel.addEventListener(\"change\", e=>{\n      const id = e.target.dataset.id, v = e.target.value;\n      state.entregaStatus[id] = v;\n      STATUS_OPTS.forEach(o=>e.target.classList.remove(\"st-\"+o.v));\n      e.target.classList.add(\"st-\"+v);\n      renderIndicadores();\n      renderRanking();\n      scheduleSave();\n    });\n  });\n}\n\n/* ============ INDICADORES ============ */\nfunction statusCounts(){\n  const counts = {};\n  STATUS_OPTS.forEach(o=>counts[o.v]=0);\n  MAPA.forEach(r=>{ const st = state.entregaStatus[r.id] || \"afazer\"; counts[st] = (counts[st]||0)+1; });\n  return counts;\n}\nfunction encontrosConfirmados(){\n  const total = TODOS_ENCONTROS_GESTORES.length;\n  const done = TODOS_ENCONTROS_GESTORES.filter(it=>!!state.checks[it.id]).length;\n  return {done, total};\n}\nfunction renderIndicadores(){\n  const el = document.getElementById(\"panel-indicadores\");\n  const counts = statusCounts();\n  const totalMapa = MAPA.length;\n  const enc = encontrosConfirmados();\n  const encPct = pct(enc.done, enc.total);\n  el.innerHTML = `\n    <div class=\"panel-head\"><p class=\"eyebrow\">Indicadores</p><h2>Indicadores de acompanhamento</h2>\n      <p class=\"panel-sub\">Números tirados direto do Mapa de entregas, do PDI e dos encontros da Escola de Gestores. Pensado para a coordenação acompanhar o andamento.</p></div>\n    <div class=\"grid stat-grid\">\n      ${STATUS_OPTS.map(o=>`<div class=\"stat-card st-card-${o.v}\"><div class=\"stat-num\">${counts[o.v]}</div><div class=\"stat-lbl\">${esc(o.l)}</div></div>`).join(\"\")}\n    </div>\n    <div class=\"card\" style=\"margin-top:14px;\">\n      <h3>${icon(\"map\")}Progresso das entregas do Mapa</h3>\n      <div class=\"seg-bar\">${STATUS_OPTS.map(o=>{\n        const w = totalMapa ? (counts[o.v]/totalMapa*100) : 0;\n        if(w<=0) return \"\";\n        return `<div class=\"seg seg-${o.v}\" style=\"width:${w}%;\" title=\"${esc(o.l)}, ${counts[o.v]} de ${totalMapa}\"></div>`;\n      }).join(\"\")}</div>\n      <div class=\"seg-legend\">${STATUS_OPTS.map(o=>`<span class=\"leg-item\"><span class=\"leg-dot dot-${o.v}\"></span>${esc(o.l)}, ${counts[o.v]} de ${totalMapa}</span>`).join(\"\")}</div>\n    </div>\n    <div class=\"grid grid-2\" style=\"margin-top:14px;\">\n      <div class=\"card\">\n        <h3>${icon(\"pdi\")}Progresso do PDI</h3>\n        <div class=\"row-between\"><span style=\"font-size:13px;color:var(--text-soft);\">Curso atual: <b>${esc((PDI_CURSO_OPTS.find(o=>o.v===state.pdiCursoAtual)||{}).l||\"\")}</b></span><b>${state.pdiPercent}%</b></div>\n        <div class=\"progress-track\" style=\"margin-top:8px;\"><div class=\"progress-fill\" style=\"width:${state.pdiPercent}%;\"></div></div>\n      </div>\n      <div class=\"card\">\n        <h3>${icon(\"bell\")}Presença nos encontros, Escola de Gestores</h3>\n        <div class=\"row-between\"><span style=\"font-size:13px;color:var(--text-soft);\">${enc.done} de ${enc.total} confirmados</span><b>${encPct}%</b></div>\n        <div class=\"progress-track\" style=\"margin-top:8px;\"><div class=\"progress-fill\" style=\"width:${encPct}%;background:linear-gradient(90deg,var(--laranja),var(--amarelo));\"></div></div>\n      </div>\n    </div>`;\n}\n\n/* ============ RANKING ============ */\nconst STATUS_PRIORITY = {bloqueado:0, aguardando:1, afazer:2, andamento:3, concluido:4};\nfunction frenteStatus(n){ return state.entregaStatus[\"m\"+n] || \"afazer\"; }\nfunction statusLabel(v){ return (STATUS_OPTS.find(o=>o.v===v)||{}).l || v; }\nfunction rankingRowHtml(rank, fr){\n  const st = frenteStatus(fr.n);\n  const nome = triText(fr.n, \"nome\", fr.nome);\n  const peso = triPeso(fr);\n  return `<div class=\"rank-row\">\n    <div class=\"rank-pos\">${rank}</div>\n    <div class=\"rank-info\"><div class=\"rank-nome\">${fr.n}. ${esc(nome)}</div><div class=\"rank-peso\">${peso}% do trimestre</div></div>\n    <span class=\"badge-status st-${st}\">${esc(statusLabel(st))}</span>\n  </div>`;\n}\nfunction renderRanking(){\n  const el = document.getElementById(\"panel-ranking\");\n  const byUrgencia = [...TRIMESTRE].sort((a,b)=> STATUS_PRIORITY[frenteStatus(a.n)] - STATUS_PRIORITY[frenteStatus(b.n)] || a.n-b.n);\n  const byPeso = [...TRIMESTRE].sort((a,b)=> triPeso(b) - triPeso(a) || a.n-b.n);\n  el.innerHTML = `\n    <div class=\"panel-head\"><p class=\"eyebrow\">Ranking</p><h2>Ranking das frentes do Plano de Trabalho</h2>\n      <p class=\"panel-sub\">As 11 frentes do Plano, em dois recortes: o que precisa de atenção primeiro, e o que tem mais peso no trimestre. O status de cada uma é o mesmo marcado na aba Mapa de entregas.</p></div>\n    <div class=\"grid grid-2\">\n      <div class=\"card\">\n        <h3>${icon(\"bell\")}Por urgência</h3>\n        <p class=\"panel-sub\" style=\"margin-bottom:10px;\">Bloqueado e aguardando aparecem primeiro, como alerta.</p>\n        <div class=\"rank-list\">${byUrgencia.map((fr,i)=>rankingRowHtml(i+1,fr)).join(\"\")}</div>\n      </div>\n      <div class=\"card\">\n        <h3>${icon(\"tri\")}Por peso no trimestre</h3>\n        <p class=\"panel-sub\" style=\"margin-bottom:10px;\">Da frente de maior peso percentual para a de menor.</p>\n        <div class=\"rank-list\">${byPeso.map((fr,i)=>rankingRowHtml(i+1,fr)).join(\"\")}</div>\n      </div>\n    </div>`;\n}\n\n/* ============ INIT ============ */\nfunction renderAll(){\n  renderInicio(); renderSemana(); renderMes(); renderBimestre(); renderTrimestre(); renderPDI(); renderMapa();\n  renderIndicadores(); renderRanking();\n}\nasync function init(){\n  state = await loadInitialState();\n  document.getElementById(\"logoImg\").src = \"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAiAAAAJeCAYAAACNob6tAAEAAElEQVR4nOy9eZgsWVXu/Vtr74jIzKo6Y0+n6W66m2ae50EUUSYREWTQqyCCggjqFUVFFKer98rVzwkR9Tor4uzV64ATIigKiMzN2NDQ9HzmqsrMiNh7r++PHZGVVec0YDfafbrifZ6szMqMzBgyMva713rXu4QBAwbcfMjSvQGmgAO0eyGChMXizvrFC/JDw3mhDe1iGe+VNiREBLO8VDkqaJo2f2zqFlSnCiIpiiRS5UgakZUSWymgUnyzQfGVT2PlR77/ORefOHrVZVURLvYu3gNr72ZihyzpKAmFJl8BhZhzYDXQIGEaLR0W5z6VcB9rov/QqNz/gauvPvqhJz/1jUerCc2JRBs9aXOGzCNmitQJbcHcyBObYHhMDUkRkwQe8IwwIo6WQpVZSjSAiQNxkFy3oy1CwgEmEBfHvcr3KQJbx3fAgAFnDuQzLzJgwICbgnS/IFv8URbkQwBLIGlrecuvCh4DvCpNagAoq4KmbTHrPwvKsqRpGgRkPC5sNm/Fe0QMTYnkIO1bQ845gJGYtFPO+rX/86Jz73LxOfdpptc/fKUKXzjfuOGSA2tFWD95Q5xUOkpxJmYR75WIgClqebvF+kuCZeKkRkJpY8L71XZeuyg6rpysztzkwL8dnbo3rR284J+/9SUvu+Ktb2+P6JhjdcRuOAKzgJriYiIChmFOkJTUFGXkK0KYAXmBYuSZ1QFcAQFEFUsRIWTeJd1hEcCKbjMjW4xswIABZxIGAjJgwM2E0JOJPDAmlgZIWXoBFtERQVESQlq8pF3EA8mTf+vGU18gocZGvhBCKw6cFxAjGNgjHo6sH+MOT3zC2sXf/dJvv9N113zyMQf2Tp68efLInvnmUfauVkhsIM6JbcNoXEGKzOdzvPcUhSPGHFNQ84Ag/UZ1BCQRCZYoqzEhCsaYNniqcpWTG1OqkSMR8aNxHK/u/9cg1Z++/0PXvOOl3/OHH9l3sLj6vR9o7YajECKF+kmqY4qJHCmx0BgGZVXR1LO8/936i8IRWkj47igHcjRpiWzYcjhowIABZxoGAjJgwM3EZyQgy0h9ZCSTj2UY4EuHmRE7IoLlu8qhBXgJJAfh/veCe971vHPgxEN/8BUvvu+B1ZNP2Fy/+hHTzQ2pZ1NWJyWFdyk0cxlXJW0zl8lkQjuvUVXqNiLiKMsRMUbMegKS90QWg3omIOIgpYAWnuMnNqlGa6yunc3hG0+yf+8KTX0UpEkJ06aNtFKwunbIktv/7+M9F/3Zb7z27975z2/76Bvf9M83rF97BAlQtEI0SCjmq4mEem7ioPRCM4toR0ISC function parseISO(d){ const [y,m,day]=d.split("-").map(Number); return new Date(y, m-1, day); }
function isPastEncontro(item){ const d=parseISO(item.data); d.setHours(23,59,0,0); return d < new Date(); }
function isTodayEncontro(item){ const d=parseISO(item.data); const n=new Date(); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate(); }
function isThisWeekEncontro(item){
  const d = parseISO(item.data);
  const now = new Date();
  const dow = (now.getDay()+6)%7;
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate()-dow);
  const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()+6, 23,59,59);
  return d>=monday && d<=sunday;
}
function proximoEncontroGestores(){
  const now = new Date();
  const future = TODOS_ENCONTROS_GESTORES.filter(it=>{ const d=parseISO(it.data); d.setHours(23,59,0,0); return d>=now; });
  future.sort((a,b)=>parseISO(a.data)-parseISO(b.data));
  return future[0] || null;
}

/* ============ PERSISTENCE ============ */
const LS_KEY = 'nr_painel_state_v1';
let saveTimer = null;
function scheduleSave(){
  showSaveIndicator();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      const artifact = await window.claude?.use?.('artifact');
      if(artifact && artifact.publish){ await artifact.publish(buildFullDocument(state)); }
    }catch(e){ /* conflito ou indisponivel, sem retry */ }
  }, 700);
}
function showSaveIndicator(){
  const el = document.getElementById('saveIndicator');
  if(!el) return;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 1600);
}
function replaceFirst(str, token, val){
  const i = str.indexOf(token);
  if(i<0) return str;
  return str.slice(0,i) + val + str.slice(i+token.length);
}
function sealScriptClose(jsonStr){ return jsonStr.replace(/<\/script/gi, "<\\/script"); }
function buildFullDocument(st){
  const shell = window.__NR_SHELL_TEMPLATE__;
  const escapedShell = sealScriptClose(JSON.stringify(shell));
  let doc = shell.replace('SHELL_TEMPLATE_TOKEN_9c1b', escapedShell);
  doc = replaceFirst(doc, 'STATE_JSON_TOKEN_7f3a', sealScriptClose(JSON.stringify(st)));
  return '<!doctype html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n</head>\n<body>\n' + doc + '\n</body>\n</html>';
}
async function loadInitialState(){
  let embedded = defaultState();
  try{ embedded = JSON.parse(document.getElementById('state-data').textContent); }catch(e){}
  try{
    const artifact = await window.claude?.use?.('artifact');
    if(!artifact){
      const ls = localStorage.getItem(LS_KEY);
      if(ls){ try{ return Object.assign(defaultState(), JSON.parse(ls)); }catch(e){} }
    }
  }catch(e){
    const ls = localStorage.getItem(LS_KEY);
    if(ls){ try{ return Object.assign(defaultState(), JSON.parse(ls)); }catch(e2){} }
  }
  return Object.assign(defaultState(), embedded);
}

/* ============ HELPERS ============ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function natClass(n){ return NATURE_CLASS[n] || 'rotina'; }
function pct(n,d){ return Math.round((n/d)*100); }
/* ============ EDITABLE TEXT ============ */
function ed(key, fallback){
  const v = state.edits && state.edits[key];
  return (v!==undefined && v!==null && v!=="") ? v : fallback;
}
function edHtml(key, fallback, tag, extra){
  tag = tag || "span";
  return '<'+tag+' class="editable '+(extra||'')+'" contenteditable="true" spellcheck="false" data-edit-key="'+key+'">'+esc(ed(key,fallback)).replace(/\n/g,"<br>")+'</'+tag+'>';
}
function setupEditableDelegation(){
  const root = document.querySelector("main.wrap");
  if(!root || root._editWired) return;
  root._editWired = true;
  root.addEventListener("input", e=>{
    const t = e.target;
    if(!(t instanceof HTMLElement) || !t.hasAttribute("data-edit-key")) return;
    const key = t.getAttribute("data-edit-key");
    state.edits[key] = (t.innerText || "").replace(/\n+$/,"");
    if(key.startsWith("tri_") && (key.endsWith("_peso") || key.endsWith("_nome"))){
      renderRanking();
    }
    scheduleSave();
  });
}
function todayStr(){
  const d = new Date();
  const dias=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
  const meses=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  return {dow:dias[d.getDay()], full:d.getDate()+" de "+meses[d.getMonth()]+" de "+d.getFullYear(), d};
}
function mesAtualKey(){
  const m = new Date().getMonth(); // 8=set,9=out,10=nov

  nav.querySelectorAll(".tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{ switchTab(btn.dataset.tab); });

function switchTab(key){
  activeTab = key;
  TABS.forEach(t=>{
    document.getElementById("panel-"+t.key).hidden = t.key!==key;
  });
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===key)));
  window.scrollTo({top:0, behavior:"instant"});
}

/* ============ SEMANA ============ */
function encontrosGestoresListHtml(){
  const rows = TODOS_ENCONTROS_GESTORES.map(it=>{
    const done = !!state.checks[it.id];
    const past = isPastEncontro(it);
    const hoje = isTodayEncontro(it);
    const semana = isThisWeekEncontro(it);
    let badge = "";
    if(hoje) badge = `<span class="chip chip-hoje">Hoje</span>`;
    else if(past) badge = `<span class="chip chip-passado">Realizado</span>`;
    else if(semana) badge = `<span class="chip chip-semana">Esta semana</span>`;
    return `<div class="encontro-row ${done?'done':''} ${hoje?'is-today':''}">
      <label class="confirm-check"><input type="checkbox" data-id="${it.id}" ${done?"checked":""}><span></span></label>
      <div class="er-data">${esc(it.dataLabel)}<span>${esc(it.dow)}</span></div>
      <div class="er-info">
        <div class="er-h">${esc(it.h)}${it.mes==="dez"?" · presencial em Pacajá":" · online, presença obrigatória"}</div>
        <div class="er-p">${esc(it.publico)} · ${esc(it.enc)}</div>
      </div>
      ${badge}
    </div>`;
  }).join("");
  return `<div class="card" style="margin-bottom:16px;">
    <h3>${icon("bell")}Escola de Gestores e Lideranças Educacionais, Pacajá</h3>
    <p class="panel-sub" style="margin-bottom:12px;">Dez encontros online, de setembro a novembro, mais o Seminário de Integração presencial em 4 de dezembro. Presença obrigatória em todos. Estes compromissos têm data marcada e não se repetem toda semana, por isso ficam à parte da grade abaixo.</p>
    <div class="encontro-list">${rows}</div>
  </div>`;
}
function renderSemana(){
  const el = document.getElementById("panel-semana");
  el.innerHTML = `
    <div class="panel-head"><p class="eyebrow">Segunda a sexta</p><h2>Cronograma semanal</h2>
      <p class="panel-sub">Jornada das 9h às 18h, almoço das 13h às 14h. Quarta e sexta, das 16h às 18h, ficam protegidas para o PDI.</p></div>
    ${encontrosGestoresListHtml()}
    <div class="week-toolbar"><button class="btn" id="btnResetWeek">${icon("reset")}Reiniciar marcações da semana</button></div>
    <div class="week-grid">${WEEK.map(renderDay).join("")}</div>`;
  el.querySelectorAll(".block input[type=checkbox]").forEach(cb=>{
    cb.addEventListener("change", e=>{
      const id = e.target.dataset.id;
      state.checks[id] = e.target.checked;
      e.target.closest(".block").classList.toggle("done", e.target.checked);
      scheduleSave();
    });
  });
  el.querySelectorAll(".encontro-row input[type=checkbox]").forEach(cb=>{
    cb.addEventListener("change", e=>{
      const id = e.target.dataset.id;
      state.checks[id] = e.target.checked;
      e.target.closest(".encontro-row").classList.toggle("done", e.target.checked);
      renderIndicadores();
      scheduleSave();
    });
  });
  document.getElementById("btnResetWeek").addEventListener("click", ()=>{
    WEEK.forEach(d=>d.blocos.forEach(b=>{ if(!b.lunch) delete state.checks[b.id]; }));
    renderSemana();
    scheduleSave();
  });
}
function renderDay(day){
  return `<div class="day-card">
    <div class="day-head" style="background:${day.cor};"><div class="d">${day.nome}-feira</div><div class="f">${edHtml('foco_'+day.key, day.foco)}</div></div>
    <div class="day-body">${day.blocos.map(b=>{
      if(b.lunch) return `<div class="lunch">Almoço, 13h às 14h</div>`;
      const done = !!state.checks[b.id];
      return `<div class="block ${b.n==='PDI'?'pdi-block':''} ${done?'done':''}">
        ${b.lock ? `<span class="lock">${icon("lock")}</span>` : `<input type="checkbox" data-id="${b.id}" ${done?"checked":""}>`}
        <div style="flex:1;min-width:0;">
          <div class="btime">${edHtml('h_'+b.id, b.h)}</div>
          ${edHtml('t_'+b.id, b.t, "div", "btxt")}
          <span class="tag tag-${natClass(b.n)}">${b.n}</span>
        </div>
      </div>`;
    }).join("")}</div>
  </div>`;
}

/* ============ TRIMESTRE ============ */
function triText(n, field, fallback){ return ed('tri_'+n+'_'+field, fallback); }
function triPeso(fr){
  const raw = state.edits['tri_'+fr.n+'_peso'];
  if(raw===undefined || raw===null || raw==="") return fr.peso;
  const num = parseFloat(String(raw).replace(",", ".").replace("%",""));
  return isNaN(num) ? fr.peso : num;
}
function renderTrimestre(){
  const el = document.getElementById("panel-trimestre");
  el.innerHTML = `

function renderMapa(){

/* ============ INDICADORES ============ */
function statusCounts(){
  const counts = {};
  STATUS_OPTS.forEach(o=>counts[o.v]=0);
  MAPA.forEach(r=>{ const st = state.entregaStatus[r.id] || "afazer"; counts[st] = (counts[st]||0)+1; });
  return counts;
}
function encontrosConfirmados(){
  const total = TODOS_ENCONTROS_GESTORES.length;
  const done = TODOS_ENCONTROS_GESTORES.filter(it=>!!state.checks[it.id]).length;
  return {done, total};
}
function renderIndicadores(){
  const el = document.getElementById("panel-indicadores");
  const counts = statusCounts();
  const totalMapa = MAPA.length;
  const enc = encontrosConfirmados();
  const encPct = pct(enc.done, enc.total);
  el.innerHTML = `
    <div class="panel-head"><p class="eyebrow">Indicadores</p><h2>Indicadores de acompanhamento</h2>
      <p class="panel-sub">Números tirados direto do Mapa de entregas, do PDI e dos encontros da Escola de Gestores. Pensado para a coordenação acompanhar o andamento.</p></div>
    <div class="grid stat-grid">
      ${STATUS_OPTS.map(o=>`<div class="stat-card st-card-${o.v}"><div class="stat-num">${counts[o.v]}</div><div class="stat-lbl">${esc(o.l)}</div></div>`).join("")}
    </div>
    <div class="card" style="margin-top:14px;">
      <h3>${icon("map")}Progresso das entregas do Mapa</h3>
      <div class="seg-bar">${STATUS_OPTS.map(o=>{
        const w = totalMapa ? (counts[o.v]/totalMapa*100) : 0;

        return `<div class="seg seg-${o.v}" style="width:${w}%;" title="${esc(o.l)}, ${counts[o.v]} de ${totalMapa}"></div>`;
      }).join("")}</div>
      <div class="seg-legend">${STATUS_OPTS.map(o=>`<span class="leg-item"><span class="leg-dot dot-${o.v}"></span>${esc(o.l)}, ${counts[o.v]} de ${totalMapa}</span>`).join("")}</div>
    </div>
    <div class="grid grid-2" style="margin-top:14px;">
      <div class="card">
        <h3>${icon("pdi")}Progresso do PDI</h3>
        <div class="row-between"><span style="font-size:13px;color:var(--text-soft);">Curso atual: <b>${esc((PDI_CURSO_OPTS.find(o=>o.v===state.pdiCursoAtual)||{}).l||"")}</b></span><b>${state.pdiPercent}%</b></div>
        <div class="progress-track" style="margin-top:8px;"><div class="progress-fill" style="width:${state.pdiPercent}%;"></div></div>
      </div>
      <div class="card">
        <h3>${icon("bell")}Presença nos encontros, Escola de Gestores</h3>

}

/* ============ RANKING ============ */
const STATUS_PRIORITY = {bloqueado:0, aguardando:1, afazer:2, andamento:3, concluido:4};
function frenteStatus(n){ return state.entregaStatus["m"+n] || "afazer"; }
function statusLabel(v){ return (STATUS_OPTS.find(o=>o.v===v)||{}).l || v; }
function rankingRowHtml(rank, fr){
  const st = frenteStatus(fr.n);
  const nome = triText(fr.n, "nome", fr.nome);
  const peso = triPeso(fr);
  return `<div class="rank-row">
    <div class="rank-pos">${rank}</div>
    <div class="rank-info"><div class="rank-nome">${fr.n}. ${esc(nome)}</div><div class="rank-peso">${peso}% do trimestre</div></div>
    <span class="badge-status st-${st}">${esc(statusLabel(st))}</span>
  </div>`;
}
function renderRanking(){
  const el = document.getElementById("panel-ranking");
  const byUrgencia = [...TRIMESTRE].sort((a,b)=> STATUS_PRIORITY[frenteStatus(a.n)] - STATUS_PRIORITY[frenteStatus(b.n)] || a.n-b.n);
  const byPeso = [...TRIMESTRE].sort((a,b)=> triPeso(b) - triPeso(a) || a.n-b.n);
  el.innerHTML = `
    <div class="panel-head"><p class="eyebrow">Ranking</p><h2>Ranking das frentes do Plano de Trabalho</h2>
      <p class="panel-sub">As 11 frentes do Plano, em dois recortes: o que precisa de atenção primeiro, e o que tem mais peso no trimestre. O status de cada uma é o mesmo marcado na aba Mapa de entregas.</p></div>
    <div class="grid grid-2">
      <div class="card">
        <h3>${icon("bell")}Por urgência</h3>
        <p class="panel-sub" style="margin-bottom:10px;">Bloqueado e aguardando aparecem primeiro, como alerta.</p>
        <div class="rank-list">${byUrgencia.map((fr,i)=>rankingRowHtml(i+1,fr)).join("")}</div>
      </div>
      <div class="card">
        <h3>${icon("tri")}Por peso no trimestre</h3>
        <p class="panel-sub" style="margin-bottom:10px;">Da frente de maior peso percentual para a de menor.</p>
        <div class="rank-list">${byPeso.map((fr,i)=>rankingRowHtml(i+1,fr)).join("")}</div>
      </div>
    </div>`;
}

/* ============ INIT ============ */
function renderAll(){
  renderInicio(); renderSemana(); renderMes(); renderBimestre(); renderTrimestre(); renderPDI(); renderMapa();
  renderIndicadores(); renderRanking();
}
